services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    networks:
      - guide-net

  agent:
    build: .
    container_name: guide-agent
    ports:
      - "8501:8080"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./chat_logs:/app/chat_logs
      - ./eval_log.jsonl:/app/eval_log.jsonl
    depends_on:
      - redis
      - weather-mcp
    restart: always
    networks:
      - guide-net
    dns:
      - 114.114.114.114
      - 8.8.8.8

  weather-mcp:
    build: .
    command: pdm run python weather_server.py
    ports:
      - "8000:8000"
    networks:
      - guide-net
    dns:
      - 114.114.114.114
      - 8.8.8.8
    restart: always

networks:
  guide-net:
    driver: bridge