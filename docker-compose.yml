services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    networks:
      - guide-net

  agent:
    build: .
    container_name: guide-agent
    ports:
      - "8501:8080"
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./chat_logs:/app/chat_logs
      - ./eval_log.jsonl:/app/eval_log.jsonl
      - ./hf_cache:/root/.cache/huggingface
      - ./bge_reranker_cache:/app/bge_reranker_cache
    depends_on:
      - redis
      - weather-mcp
    restart: always
    networks:
      - guide-net
    deploy:
      resources:
        limits:
          memory: 4G
    # 如果 ECS 实例内存不足，OOM Killer 会先杀容器而不是整个系统
    # BGE-Reranker 模型约 1.1GB，加上 Python/ChromaDB 等约需 2-3GB

  weather-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8000:8000"
    networks:
      - guide-net
    restart: always

networks:
  guide-net:
    driver: bridge