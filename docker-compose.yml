services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: always
    networks:
      - guide-net

  agent:
    build: .
    container_name: guide-agent
    ports:
      - "8501:8080"
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./chat_logs:/app/chat_logs
      - ./eval_log.jsonl:/app/eval_log.jsonl
      - ./hf_cache:/root/.cache/huggingface
    depends_on:
      - redis
      - weather-mcp
    restart: always
    networks:
      - guide-net

  weather-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - "8000:8000"
    networks:
      - guide-net
    restart: always

networks:
  guide-net:
    driver: bridge