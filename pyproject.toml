[project]
name = "guide-exam-agent"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "yangzk",email = "yangzk@163.com"},
]
dependencies = [
    "langchain>=1.3.9",
    "langgraph>=1.2.5",
    "langchain-openai>=1.3.2",
    "langchain-community<0.4.2",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "chromadb>=1.5.9",
    "redis>=6.2.0,<7.0.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "numpy>=2.4.6",
    "dashscope>=1.25.21",
    "pypdf>=6.13.2",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
    "mcp>=1.27.2",
    "langgraph-checkpoint-redis>=0.1.0",
    "langfuse==4.7.1",
    "langchain-mcp-adapters>=0.3.0",
    "uvicorn>=0.49.0",
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "ragas>=0.2.2",
    "transformers>=4.40.0",
    "sentencepiece>=0.2.0",
    "tokenizers>=0.21.0",
]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm.dev-dependencies]
dev = [
    "streamlit>=1.58.0",
    "datasets>=5.0.0",
    "langchain-deepseek>=1.1.0",
    "starlette>=1.3.1",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pdm.install]
self = false
